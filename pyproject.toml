[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "AI_Analysis_of_RT"
version = "0.0.1"
description = "Using AI to analyze ERM RT tickets"
authors = [
  { name = "Elissa Reiskind" },
]

readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
]
requires-python = "~=3.12.0"
dependencies = [
  "awscli",
  "mkdocs",
  "pip",
  "pytest",
  "python-dotenv",
]

[project.urls]
Repository = "https://github.com/ereiskind/AI_Analysis_of_RT.git"